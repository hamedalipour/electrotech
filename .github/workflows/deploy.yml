name: Deploy to Iranian Host

# استقرار خودکار نسخه استاتیک Next (خروجی out/) روی هاست اشتراکی ایران.
# دیپلوی GitHub Pages و Cloudflare Pages در ورک‌فلوی
# .github/workflows/deploy-pages-cloudflare.yml نگه داشته شده و
# فقط به‌صورت دستی (workflow_dispatch) اجرا می‌شود.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-host
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-out
          path: out
          retention-days: 7

  # انتشار به هاست اشتراکی ایران — پوشه addon دامنه electrotechco.ir
  deploy-host:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site-out
          path: out
      - name: Install lftp
        run: sudo apt-get update -y && sudo apt-get install -y lftp
      - name: Upload to Iranian host
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" <<EOF
          set ftp:passive-mode yes
          set ftp:ssl-allow no
          set net:max-retries 3
          set net:timeout 30
          cd /electrotechco
          lcd "$GITHUB_WORKSPACE/out"
          mirror -R --delete --no-perms
          # mirror به‌طور پیش‌فرض فایل‌های مخفی را رد می‌کند؛ .htaccess باید
          # صریح آپلود شود وگرنه ریدایرکت‌ها/HSTS/MIME روی هاست اعمال نمی‌شوند.
          put .htaccess
          bye
          EOF
